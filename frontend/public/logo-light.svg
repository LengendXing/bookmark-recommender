<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f2"/>
    </linearGradient>
    <linearGradient id="fgLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#333333"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="10" y="10" width="180" height="180" rx="36" ry="36" fill="url(#bgLight)"/>

  <!-- Subtle border ring -->
  <rect x="10" y="10" width="180" height="180" rx="36" ry="36" fill="none" stroke="#d4d4d4" stroke-width="2"/>

  <!-- Inner subtle glow ring -->
  <rect x="40" y="40" width="120" height="120" rx="24" ry="24" fill="none" stroke="#e5e5e5" stroke-width="1"/>

  <!-- Decorative corner dots -->
  <circle cx="46" cy="46" r="2.5" fill="#999999"/>
  <circle cx="154" cy="46" r="2.5" fill="#666666"/>
  <circle cx="46" cy="154" r="2.5" fill="#666666"/>
  <circle cx="154" cy="154" r="2.5" fill="#999999"/>

  <!-- Bold letter C -->
  <text x="100" y="103" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', 'Arial Black', sans-serif"
        font-size="96" font-weight="900" fill="url(#fgLight)" letter-spacing="-2">
    C
  </text>

  <!-- Bottom small decorative line -->
  <line x1="75" y1="148" x2="125" y2="148" stroke="#999999" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Subtle top accent dot -->
  <circle cx="100" cy="32" r="2" fill="#aaaaaa"/>
</svg>
