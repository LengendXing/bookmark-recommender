<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#5856D6"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="10" y="10" width="180" height="180" rx="36" ry="36" fill="url(#bg)"/>

  <!-- Subtle border ring -->
  <rect x="10" y="10" width="180" height="180" rx="36" ry="36" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.6"/>

  <!-- Inner subtle glow ring -->
  <rect x="40" y="40" width="120" height="120" rx="24" ry="24" fill="none" stroke="url(#accent)" stroke-width="1" opacity="0.2"/>

  <!-- Decorative corner dots -->
  <circle cx="46" cy="46" r="3" fill="#007AFF" opacity="0.5"/>
  <circle cx="154" cy="46" r="3" fill="#5856D6" opacity="0.5"/>
  <circle cx="46" cy="154" r="3" fill="#5856D6" opacity="0.5"/>
  <circle cx="154" cy="154" r="3" fill="#007AFF" opacity="0.5"/>

  <!-- Character "蠢" -->
  <text x="100" y="118" text-anchor="middle" dominant-baseline="central"
        font-family="-apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif"
        font-size="76" font-weight="700" fill="white" letter-spacing="-2">
    蠢
  </text>

  <!-- Bottom small decorative line -->
  <line x1="70" y1="150" x2="130" y2="150" stroke="url(#accent)" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>

  <!-- Subtle top accent dot -->
  <circle cx="100" cy="32" r="2" fill="#007AFF" opacity="0.3"/>
</svg>
